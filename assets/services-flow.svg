<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#57e6ff"/><stop offset="1" stop-color="#a98cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1000" height="500" rx="28" fill="#07111c"/>
<text x="50" y="48" fill="#8198ad" font-family="monospace" font-size="16">SERVIZI DI RETE · CHI FA COSA?</text>
<g font-family="sans-serif" text-anchor="middle">
<g transform="translate(55 120)"><rect width="180" height="130" rx="18" fill="#0b1b29" stroke="#57e6ff"/><text x="90" y="45" fill="#57e6ff" font-size="22">DNS</text><text x="90" y="78" fill="white" font-size="15">nome → IP</text><text x="90" y="102" fill="#8198ad" font-size="12">www.scuola.it</text></g>
<g transform="translate(290 120)"><rect width="180" height="130" rx="18" fill="#0b1b29" stroke="#57e6ff"/><text x="90" y="45" fill="#57e6ff" font-size="22">DHCP</text><text x="90" y="78" fill="white" font-size="15">assegna IP</text><text x="90" y="102" fill="#8198ad" font-size="12">IP · mask · gateway</text></g>
<g transform="translate(525 120)"><rect width="180" height="130" rx="18" fill="#0b1b29" stroke="#a98cff"/><text x="90" y="45" fill="#a98cff" font-size="22">ARP</text><text x="90" y="78" fill="white" font-size="15">IP → MAC</text><text x="90" y="102" fill="#8198ad" font-size="12">nella rete locale</text></g>
<g transform="translate(760 120)"><rect width="180" height="130" rx="18" fill="#0f1b31" stroke="#a98cff"/><text x="90" y="45" fill="#a98cff" font-size="22">ACL</text><text x="90" y="78" fill="white" font-size="15">permette / nega</text><text x="90" y="102" fill="#8198ad" font-size="12">traffico secondo regole</text></g>
</g>
<path d="M145 290H855" stroke="url(#g)" stroke-width="4" stroke-dasharray="10 12"/>
<circle r="9" fill="#57e6ff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M145 290 H855"/></circle>
<g font-family="monospace" font-size="14" fill="#8aa0b4"><text x="145" y="330" text-anchor="middle">TROVA</text><text x="380" y="330" text-anchor="middle">CONFIGURA</text><text x="615" y="330" text-anchor="middle">RICONOSCI</text><text x="850" y="330" text-anchor="middle">CONTROLLA</text></g>
<text x="500" y="425" text-anchor="middle" fill="white" font-family="sans-serif" font-size="21">Questi servizi collaborano per far funzionare la comunicazione.</text>
