 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5ff}.m{font-family:Inter,Arial,sans-serif;fill:#94a8bf}.node{fill:#0c1725;stroke:#3d5875;stroke-width:3}.ln{stroke:#30445d;stroke-width:4;fill:none}.pulse{fill:#57e6ff;filter:url(#glow)}</style>
